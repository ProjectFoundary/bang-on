[project]
name = "keyfx"
version = "1.0.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
description = "Bang On: direct isolated LTX effects, AlphaGen mattes and timed muzzle flashes over original footage with ComfyUI."
requires-python = ">=3.12"
dependencies = [
    "comfy-sdk==0.5.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "numpy",
    "opencv-python-headless<5",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
keyfx = "keyfx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyfx"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "keyfx/web_dist"
"THIRD_PARTY_NOTICES.txt" = "keyfx/THIRD_PARTY_NOTICES.txt"
